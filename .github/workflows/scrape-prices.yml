# Reads the big stores' category pages (phones, TVs, washers, fridges, ACs, laptops, and home, beauty, fashion, electronics and flash-sale sections) into the site's own price list, so searches already know
# their prices and spend fewer free web searches. Free: GitHub runs it on a schedule. Same two repository secrets as
# check-watches.yml: SITE_URL and CRON_SECRET. Then it makes today's deals list (/deals).
name: read store prices
on:
  schedule:
    - cron: "23 3 * * *"    # 05:23 Cairo
    - cron: "23 13 * * *"   # 15:23 Cairo
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # one store at a time: the free server has little memory
      matrix:
        store: [amazon.eg, jumia.com.eg]
    steps:
      - name: Read ${{ matrix.store }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          # the free server sleeps: the first request wakes it (up to a minute), so retry a few times
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 1500 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/scrape?store=${{ matrix.store }}"
          echo
  deals:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Let the LLM read the new products' titles (brand, model, kind in English and Arabic, size)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 1500 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/understand" || echo "(not all read: the next run goes on)"
          echo
      - name: Make today's deals list (every deal opened on its store page)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 2700 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/deals"
          echo
      - name: Read the affiliate networks' promo codes again (/coupons)
        if: always()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/coupons"
          echo
