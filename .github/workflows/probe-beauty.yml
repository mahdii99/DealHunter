name: probe beauty pages (temporary)
on:
  push:
    branches: [feature/beauty-products]
    paths: [.github/workflows/probe-beauty.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="DealHunterBot/1.0 (+https://dealhunter-opk9.onrender.com/bot)"
          curl -s -m 30 -A "$UA" -L https://www.jumia.com.eg/beauty/ | grep -o 'href="/[a-z0-9-]*/"' | sort | uniq -c | sort -rn | head -80
          for u in "https://sourcebeauty.com/search/suggest.json?q=serum&resources[type]=product&resources[limit]=10" \
                   "https://www.bloompharmacy.com/search/suggest.json?q=serum&resources[type]=product&resources[limit]=10" ; do
            curl -g -s -m 30 -A "$UA" -L "$u" | head -c 1500; echo; echo ----
          done
          curl -s -m 30 -A "$UA" -L "https://sourcebeauty.com/search?q=serum" | grep -o 'application/ld+json' | wc -l
          curl -s -m 30 -A "$UA" -L "https://sourcebeauty.com/search?q=serum" | grep -o -E '"price":[^,]{0,20}|class="price[^"]*"' | head -5
          for r in https://www.jumia.com.eg/robots.txt https://sourcebeauty.com/robots.txt https://www.bloompharmacy.com/robots.txt; do echo "== $r"; curl -s -m 20 -A "$UA" "$r" | grep -i -E "^(user-agent|disallow).*" | head -40; done
