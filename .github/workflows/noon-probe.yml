# Run by hand: checks from the server that noon's public product sitemaps and a sample of product pages open for
# our crawler name (app/noon_index.py). Nothing is saved. Same secrets as scrape-prices.yml.
name: noon probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe noon from the server
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 900 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/noon-probe?pages=20" | python3 -m json.tool
