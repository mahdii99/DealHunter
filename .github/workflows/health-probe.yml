# temporary: is the server up, and how fast does it answer
name: health probe (temporary)
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          for i in $(seq 1 24); do
            date -u +%T
            curl -s -o /tmp/b -w "health %{http_code} %{time_total}s\n" -m 60 "$SITE_URL/health"; head -c 200 /tmp/b; echo
            curl -s -o /dev/null -w "home %{http_code} %{time_total}s\n" -m 60 "$SITE_URL/"
            sleep 10
          done
