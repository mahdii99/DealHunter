# Once a week: noon's public product sitemaps (names and addresses, no prices) into the index searches use for their
# "see it on noon" links (app/noon_index.py). 80 files, 20 per call (short requests suit the free server).
# Same two repository secrets as scrape-prices.yml: SITE_URL and CRON_SECRET.
name: noon index
on:
  schedule:
    - cron: "41 1 * * 5"   # Friday 03:41 Cairo
  workflow_dispatch:
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Read noon's sitemaps
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          for first in 0 20 40 60; do
            last=$((first + 19))
            curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 1500 -X POST \
              -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/noon-index?first=$first&last=$last"
            echo
          done
