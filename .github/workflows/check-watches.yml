# Re-checks the prices of products shoppers follow, so a price drop is caught even if nobody searched for it.
# Free: GitHub runs it on a schedule. It needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     e.g. https://dealhunter-opk9.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET on the server
name: check followed prices
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:   # Actions -> check followed prices -> Run workflow: checks every followed product now
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server and run the check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVERY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set, skipping"; exit 0; fi
          # the free server sleeps: the first request wakes it (up to a minute), so retry a few times
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 180 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$SITE_URL/api/cron/check-watches?every=$EVERY"
