name: store probe (temporary)
on:
  push:
    branches: [feature/more-store-deals]
    paths: [.github/workflows/store-probe-tmp.yml, app/catalog.py, scripts/try_stores_tmp.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m scripts.try_stores_tmp btech.com
