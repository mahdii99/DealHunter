name: store probe (temporary)
on:
  push:
    branches: [feature/more-deal-stores]
    paths: [.github/workflows/store-probe-tmp.yml, scripts/store_probe.py, scripts/try_stores_tmp.py, app/catalog.py, app/stores/platforms.py, app/stores/shopify.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m scripts.try_stores_tmp btech.com,2b.com.eg,cairosales.com,kimostore.net,tradelinestores.com,compumarts.com,dreamstores-eg.com
