name: store probe (temporary)
on:
  push:
    branches: [feature/more-deal-stores]
    paths: [.github/workflows/store-probe-tmp.yml, scripts/store_probe.py, scripts/save_pages_tmp.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: >
          python -m scripts.save_pages_tmp
          https://2b.com.eg/en/mobile-and-tablet/mobiles.html https://www.rayashop.com/en/mobiles-and-tablets
          https://cairosales.com/en/tvs-screens/ https://btech.com/en/c/mobiles-tablets
          https://kimostore.net/collections/mobile-phone/products.json https://kimostore.net/collections/mobile-phone
          https://btech.com/en/collection/black-friday-offers https://www.ikea.com/eg/en/offers/
      - uses: actions/upload-artifact@v4
        with: {name: pages, path: pages/}
