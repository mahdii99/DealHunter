<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealHunter - أرخص سعر في المتاجر</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo-512.png">
<meta name="theme-color" content="#0f766e">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<script>  // theme before first paint: the visitor's choice, else the system's
  try { const t = localStorage.getItem('dh-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root { --bg:#F4F7F6; --header:rgba(244,247,246,.88); --card:#fff; --card2:#EDF2F1; --text:#13221F; --muted:#56665F;
          --border:#DCE4E1; --border2:#C3CFCB; --accent:#0F766E; --on-accent:#fff; --soft:#DDF1EC; --ink:#0B5F58;
          --deal:#B93A0A; --deal-soft:#FDEBE1; --warn:#9A4D00; --warn-soft:#FDF1DC; --scrim:rgba(10,20,18,.45); --shadow:rgba(15,40,35,.10);
          color-scheme: light; }
  :root[data-theme="dark"] { --bg:#0C1312; --header:rgba(12,19,18,.88); --card:#141F1D; --card2:#1B2926; --text:#E6EEEC; --muted:#9DAEA9;
          --border:#263633; --border2:#344743; --accent:#2DD4BF; --on-accent:#04221F; --soft:#103A35; --ink:#5EEAD4;
          --deal:#FDBA74; --deal-soft:#3A2112; --warn:#FCD34D; --warn-soft:#3A2E10; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
          color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0C1312; --header:rgba(12,19,18,.88); --card:#141F1D; --card2:#1B2926;
          --text:#E6EEEC; --muted:#9DAEA9; --border:#263633; --border2:#344743; --accent:#2DD4BF; --on-accent:#04221F; --soft:#103A35;
          --ink:#5EEAD4; --deal:#FDBA74; --deal-soft:#3A2112; --warn:#FCD34D; --warn-soft:#3A2E10; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
          color-scheme: dark; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 "IBM Plex Sans Arabic","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  :focus-visible { outline:2px solid #14B8A6; outline-offset:2px; }
  ::placeholder { color:var(--muted); opacity:1; }
  a { color:var(--ink); }
  svg { flex-shrink:0; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .display { font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif; }

  /* header */
  header { position:sticky; top:0; z-index:10; background:var(--header); border-bottom:1px solid var(--border); backdrop-filter:blur(10px); }
  .bar { max-width:1240px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
  .brand .name { font:700 21px/1.1 "Readex Pro",sans-serif; letter-spacing:-.01em; }
  .brand .name b { color:var(--accent); font-weight:700; }
  .brand .tag { display:block; font-size:12px; color:var(--muted); }
  .tools { display:flex; align-items:center; gap:8px; }
  .btn { height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); display:inline-flex;
         align-items:center; justify-content:center; gap:8px; font-size:14px; white-space:nowrap; text-decoration:none; color:var(--text); }
  .btn:hover { border-color:var(--border2); }
  .btn.icon { width:44px; padding:0; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .btn .dim { color:var(--muted); font-size:13px; }
  .mobile-only { display:none; }
  .moon { display:inline; } .sun { display:none; }
  :root[data-theme="dark"] .moon { display:none; } :root[data-theme="dark"] .sun { display:inline; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .moon { display:none; } :root:not([data-theme="light"]) .sun { display:inline; } }
  .pop-wrap { position:relative; }
  .pop { position:absolute; top:calc(100% + 8px); inset-inline-end:0; z-index:20; width:270px; padding:8px; border-radius:16px; background:var(--card);
         border:1px solid var(--border); box-shadow:0 16px 40px var(--shadow); display:grid; gap:4px; }
  .pop .hint { padding:6px 10px 8px; font-size:12px; color:var(--muted); }
  .opt { min-height:48px; padding:0 12px; border-radius:10px; border:0; background:transparent; display:flex; align-items:center;
         justify-content:space-between; gap:8px; text-align:start; }
  .opt:hover:not(:disabled), .opt[aria-checked="true"] { background:var(--soft); }
  .opt .code { font:600 12px "Readex Pro",sans-serif; padding:2px 6px; border-radius:6px; background:var(--card2); color:var(--muted); margin-inline-end:8px; }
  .opt small { color:var(--muted); font-size:12px; }

  /* layout */
  .layout { max-width:1240px; margin:0 auto; padding:28px 24px 0; display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; }
  aside { flex:1 1 240px; max-width:280px; display:grid; gap:16px; position:sticky; top:92px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:grid; gap:4px; }
  .panel h2 { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .panel .empty { font-size:13px; color:var(--muted); }
  .hist { min-height:44px; padding:8px 10px; border-radius:10px; border:0; background:transparent; display:grid; text-align:start; line-height:1.4; }
  .hist:hover { background:var(--card2); }
  .hist span { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist small { font-size:12px; color:var(--muted); }
  .saved-link { display:flex; gap:10px; align-items:center; padding:6px; border-radius:10px; text-decoration:none; color:var(--text); }
  .saved-link:hover { background:var(--card2); }
  .saved-link img, .saved-link .ph { width:40px; height:40px; border-radius:8px; object-fit:contain; background:#fff; flex-shrink:0; }
  .saved-link .ph { background:var(--card2); }
  .saved-link span { font-size:13px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .saved-link b { display:block; color:var(--ink); font-size:13px; }
  .count { min-width:28px; height:24px; padding:0 8px; border-radius:12px; background:var(--soft); color:var(--ink); font-size:13px; font-weight:600;
           display:inline-flex; align-items:center; justify-content:center; margin-inline-start:auto; }
  .promo { background:var(--soft); border-radius:16px; padding:18px; display:grid; gap:10px; }
  .promo h2 { margin:0; font-size:16px; color:var(--ink); }
  .promo p { margin:0; font-size:13px; }
  .promo button { justify-self:start; height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--ink); background:transparent; color:var(--ink); font-weight:600; font-size:14px; }
  main { flex:999 1 560px; min-width:0; display:flex; flex-direction:column; gap:16px; }

  /* empty state */
  .hero { padding:64px 24px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; }
  .hero h1 { margin:0; font-size:40px; line-height:1.25; }
  .hero p { margin:0; max-width:560px; color:var(--muted); font-size:16px; }
  .sugs { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px; max-width:640px; }
  .sug { min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--border); background:var(--card); font-size:14px; }
  .sug:hover { border-color:var(--accent); }

  /* chat */
  #chat { display:flex; flex-direction:column; gap:18px; }
  .u { align-self:flex-start; max-width:80%; padding:10px 16px; border-radius:18px 18px 18px 6px; background:var(--accent); color:var(--on-accent);
       font-weight:500; white-space:pre-wrap; overflow-wrap:anywhere; }
  [dir="ltr"] .u { border-radius:18px 18px 6px 18px; }
  .a { display:flex; flex-direction:column; gap:12px; }
  .und { font-weight:600; }
  .sugg, .req, .meta, .hint-line { font-size:13px; color:var(--muted); }
  .meta.live { display:flex; align-items:center; gap:8px; font-size:14px; }
  .meta.live .step::before { content:""; display:inline-block; width:8px; height:8px; margin-inline-end:8px; border-radius:50%; background:var(--accent);
                             animation:pulse 1s ease-in-out infinite; }
  .meta.live .secs { opacity:.6; font-size:12px; }
  @keyframes pulse { 50% { opacity:.25; } }
  .chips, .sorts { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:40px; padding:0 14px; border-radius:20px; background:var(--card); color:var(--ink); border:1px solid var(--accent); font-size:14px; }
  .sort { min-height:38px; padding:0 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:13px; font-weight:500; }
  .sort[aria-pressed="true"] { background:var(--text); color:var(--bg); border-color:var(--text); }
  .sum { padding:14px 16px; border-radius:14px; background:var(--soft); display:flex; gap:10px; align-items:flex-start; }
  .sum svg { color:var(--ink); margin-top:3px; }
  .err { color:var(--warn); font-size:13px; }
  .grid { display:flex; flex-direction:column; gap:12px; }
  .wrap { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .wrap.best { border:2px solid var(--accent); padding:15px; }
  .item { display:flex; gap:16px; align-items:flex-start; text-decoration:none; color:inherit; }
  .thumb { width:112px; height:112px; flex-shrink:0; border-radius:12px; background:#fff; border:1px solid var(--border); overflow:hidden;
           display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .thumb img { width:100%; height:100%; object-fit:contain; padding:6px; }
  .thumb.noimg { background:var(--card2); }
  .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .item .t { font-size:15px; font-weight:500; line-height:1.45; overflow-wrap:anywhere; }
  .item:hover .t { color:var(--ink); text-decoration:underline; }
  .item .p { font:700 20px "Readex Pro","IBM Plex Sans Arabic",sans-serif; color:var(--ink); margin-top:2px; }
  .item .old { text-decoration:line-through; color:var(--muted); font:400 13px "IBM Plex Sans Arabic",sans-serif; margin-inline-start:8px; }
  .coupon { font-size:13px; color:var(--deal); }
  .note { font-size:13px; color:var(--muted); }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .badge { display:inline-block; font-size:12px; font-weight:500; padding:2px 10px; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
  .badge[title] { cursor:help; }
  .badge.store { color:var(--text); }
  .badge.ok { color:var(--ink); background:var(--soft); border-color:var(--soft); }
  .badge.deal { color:var(--deal); background:var(--deal-soft); border-color:var(--deal-soft); }
  .badge.warn { color:var(--warn); background:var(--warn-soft); border-color:var(--warn-soft); }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:10px; border-top:1px solid var(--border); }
  .act { height:40px; padding:0 12px; border-radius:10px; border:1px solid var(--border); background:transparent; display:inline-flex; align-items:center;
         gap:6px; font-size:13px; text-decoration:none; color:var(--text); }
  .act.go { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; font-size:14px; }
  .act[aria-pressed="true"] svg { fill:var(--accent); stroke:var(--accent); }
  .report { margin-inline-start:auto; border:0; color:var(--muted); }
  .reasons { display:flex; flex-wrap:wrap; gap:6px; }
  .reasons button { min-height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--border); background:var(--card2); font-size:12px; }
  .thanks { font-size:13px; color:var(--ink); }

  /* composer */
  .composer { position:sticky; bottom:0; z-index:5; padding:12px 0 16px; background:var(--bg); display:grid; gap:8px; }
  .composer .box { display:flex; align-items:center; gap:8px; padding:6px; border-radius:16px; background:var(--card); border:1px solid var(--border2);
                   box-shadow:0 6px 24px var(--shadow); }
  .composer .box:focus-within { border-color:var(--accent); }
  .composer input { flex:1; min-width:0; height:48px; padding:0 12px; border:0; outline:none; background:transparent; font-size:16px; }
  .composer .send { height:48px; padding:0 20px; border-radius:12px; border:0; background:var(--accent); color:var(--on-accent); display:inline-flex;
                    align-items:center; gap:8px; font-size:15px; font-weight:600; }
  [dir="rtl"] .composer .send svg { transform:scaleX(-1); }
  .disclaimer { font-size:12px; color:var(--muted); text-align:center; }
  footer { border-top:1px solid var(--border); margin-top:24px; }
  footer .bar { flex-wrap:wrap; padding:18px 24px; font-size:13px; color:var(--muted); }
  footer nav { display:flex; flex-wrap:wrap; gap:18px; }
  footer a, footer button.link { color:var(--muted); background:none; border:0; padding:0; font-size:13px; text-decoration:underline; }

  /* sheets & dialog */
  .overlay { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:24px; }
  .overlay .scrim { position:absolute; inset:0; border:0; background:var(--scrim); cursor:default; }
  .dialog { position:relative; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; background:var(--card); border-radius:20px; padding:24px;
            box-shadow:0 24px 60px var(--shadow); display:grid; gap:14px; }
  .dialog .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .dialog .head > div { display:flex; gap:12px; align-items:flex-start; }
  .dialog h2 { margin:0; font-size:19px; }
  .dialog .sub { margin:2px 0 0; font-size:13px; color:var(--muted); }
  .badge-ic { width:44px; height:44px; border-radius:12px; background:var(--soft); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .x { width:44px; height:44px; border-radius:12px; border:0; background:var(--card2); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  fieldset { margin:0; padding:0; border:0; }
  legend, .lbl { padding:0; margin-bottom:8px; font-size:14px; font-weight:600; display:block; }
  .lbl small { font-weight:400; color:var(--muted); }
  .kinds { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .kind { position:relative; }
  .kind input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .kind span { min-height:48px; padding:0 12px; border-radius:12px; border:1.5px solid var(--border); display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; }
  .kind span::before { content:""; width:14px; height:14px; border-radius:50%; border:2px solid var(--border2); flex-shrink:0; }
  .kind input:checked + span { border-color:var(--accent); background:var(--soft); }
  .kind input:checked + span::before { border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 2px var(--card); }
  .kind input:focus-visible + span { outline:2px solid #14B8A6; outline-offset:2px; }
  .field { width:100%; padding:12px; border-radius:12px; border:1px solid var(--border2); background:var(--bg); font-size:15px; }
  textarea.field { resize:vertical; min-height:120px; line-height:1.6; }
  .field:focus { border-color:var(--accent); outline:none; }
  .counter { font-size:12px; color:var(--muted); text-align:end; margin-top:4px; }
  .row-end { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  .row-end .btn { height:48px; padding:0 20px; font-size:15px; }
  .done { display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:18px 0 4px; }
  .done .ok-ic { width:64px; height:64px; border-radius:50%; background:var(--soft); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; }
  .done p { margin:0; color:var(--muted); font-size:14px; max-width:360px; }
  .sheet-items { display:grid; gap:4px; }
  .sheet-item { min-height:52px; padding:0 14px; border-radius:14px; border:0; background:transparent; display:flex; align-items:center; gap:10px; font-size:15px; text-align:start; }
  .sheet-item:hover { background:var(--card2); }
  .sheet-item.primary { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .sheet-label { padding:10px 4px 2px; font-size:13px; font-weight:600; color:var(--muted); }
  .seg { display:grid; grid-template-columns:repeat(auto-fit, minmax(0, 1fr)); gap:6px; }
  .seg button { min-height:52px; padding:6px; border-radius:12px; border:1px solid var(--border); background:transparent; display:flex; flex-direction:column;
                align-items:center; justify-content:center; line-height:1.3; font-size:14px; font-weight:600; }
  .seg button small { font-size:12px; font-weight:400; color:var(--muted); }
  .seg button[aria-checked="true"] { border-color:var(--accent); background:var(--soft); }
  .switch { width:48px; height:28px; border-radius:14px; background:var(--border2); padding:3px; display:flex; margin-inline-start:auto; }
  .switch::after { content:""; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  [aria-checked="true"] .switch { background:var(--accent); justify-content:flex-end; }
  .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:60; padding:10px 16px; border-radius:12px; background:var(--text);
           color:var(--bg); font-size:14px; font-weight:500; box-shadow:0 8px 24px var(--shadow); }

  @media (max-width:760px) {
    .desktop-only { display:none !important; }
    .mobile-only { display:flex; }
    .bar { padding:10px 16px; }
    .layout { padding:16px 16px 0; }
    .hero { padding:28px 4px 8px; } .hero h1 { font-size:26px; }
    .wrap { padding:12px; } .wrap.best { padding:11px; }
    .item { gap:12px; }
    .thumb { width:88px; height:88px; }
    .u { max-width:90%; }
    .composer .send .lbl-send { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    .composer .send { padding:0 16px; }
    .overlay { align-items:flex-end; padding:0; }
    .dialog { max-width:none; border-radius:24px 24px 0 0; padding:12px 16px 24px; max-height:90vh; }
    .dialog::before { content:""; width:40px; height:4px; border-radius:2px; background:var(--border2); justify-self:center; }
    .row-end .btn.primary { flex:1; }
    footer { display:none; }
  }

  /* account: Google sign-in, notifications, followed products, settings */
  .acct { display:flex; align-items:center; gap:8px; }
  .acct .me img { width:28px; height:28px; border-radius:50%; }
  .acct .me { padding:0 12px 0 8px; }
  .acct .bell { position:relative; }
  .acct .bell b { position:absolute; top:-6px; inset-inline-start:-6px; min-width:18px; height:18px; padding:0 5px; font-size:11px; line-height:18px;
                  border-radius:9px; background:#dc2626; color:#fff; }
  #panel { width:min(360px, calc(100vw - 32px)); max-height:70vh; overflow:auto; padding:12px; display:block; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; min-height:36px; border-radius:10px; font-size:13px; background:transparent; color:var(--muted); border:1px solid var(--border); }
  .tabs button.on { color:var(--ink); border-color:var(--accent); background:var(--soft); }
  .row { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .row:last-child { border-bottom:0; }
  .row .when, .panel-hint { font-size:12px; color:var(--muted); }
  .row.new { font-weight:600; }
  .row a { color:inherit; }
  .row .x { float:inline-end; font-size:12px; padding:2px 8px; border-radius:8px; background:transparent; color:var(--muted); border:1px solid var(--border); }
  .set { display:grid; gap:10px; font-size:14px; }
  .set select { padding:6px; border-radius:8px; background:var(--card); color:var(--text); border:1px solid var(--border); }
  .set .danger { min-height:40px; border-radius:10px; font-size:13px; background:transparent; color:#dc2626; border:1px solid #dc2626; }
  .set .plain { min-height:40px; border-radius:10px; font-size:13px; background:transparent; border:1px solid var(--border); }
  .act.watch.on { background:var(--soft); color:var(--ink); border-color:var(--accent); }
  .regions { display:grid; gap:8px; margin:14px 0; }
  .regions button { min-height:48px; padding:0 12px; border-radius:12px; font-size:16px; background:var(--bg); border:1px solid var(--border); }

function ordered(d) {  // the results as the chosen sort shows them, each with its place in the agent's list

  if (d.sort === 'trust') list.sort((x, y) => (y.p.trusted - x.p.trusted) || ((y.p.trust_score ?? 0) - (x.p.trust_score ?? 0)) || (x.i - y.i));

async function send(text) {
  text = text.trim(); if (text.length < 2 || b.disabled) return;
  hero.hidden = true; q.value = '';
  add('u', esc(text));
  if (!history.length) remember(text);
  history.push({role: 'user', text});
  const a = add('a', `<div class="meta live"><span class="step">${t('understanding')}</span> <span class="secs"></span></div>`);
  const step = a.querySelector('.step'), secs = a.querySelector('.secs'), t0 = Date.now();
  const timer = setInterval(() => { secs.textContent = Math.round((Date.now() - t0) / 1000) + ' ' + t('sec'); }, 1000);
  b.disabled = true;
  try {
    // progress arrives line by line (what the agent is doing now), the answer comes in the last line
    const r = await fetch('/api/chat/stream', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                              body: JSON.stringify({messages: history.slice(-12), request: currentRequest})});
    if (!r.ok || !r.body) throw new Error(r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', d = null;
    while (!d) {

      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;

        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'status') step.textContent = ev.text;
        else if (ev.type === 'done') d = ev.data;
        else if (ev.type === 'error') throw new Error(ev.status);
      }
    }
    if (!d) throw new Error('no answer');
    if (d.action === 'search') currentRequest = d.request || currentRequest;
    history.push({role: 'assistant', text: said(d).slice(0, 1500)});
    a.dataset.turn = shown.length; shown.push(d);
    a.innerHTML = render(d, shown.length - 1);
  } catch (err) {
    history.pop();
    a.innerHTML = `<div class="err">${t('error')}</div>`;
  } finally { clearInterval(timer); b.disabled = false; q.focus(); }
}

  } else if (el.dataset.r) {

      body: JSON.stringify({reason: el.dataset.r, request: d.request || d.query || '', url: p.url,

  gbtn.insertAdjacentHTML('afterend',
    `<button class="btn icon bell" type="button" aria-label="${t('notes')}">
       <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10 21h4"/></svg>${unseen ? `<b>${unseen}</b>` : ''}</button>` +
    `<button class="btn me" type="button" aria-label="${t('account')}">${me.picture ? `<img src="${esc(me.picture)}" alt="" referrerpolicy="no-referrer">` : ''}<span class="nm">${esc(me.name.split(' ')[0])}</span></button>`);
}
function signedIn(d) {
  me = d.user; unseen = d.unseen || 0; drawAcct();
  if (me && me.market && markets.some(m => m.code === me.market)) { marketCode = me.market; drawRegion(); }
  if (me && !me.market) welcome();
}
async function onGoogle(resp) {
  try { signedIn(await api('/api/auth/google', {method: 'POST', body: JSON.stringify({credential: resp.credential})})); }
  catch (e) { toast(t('signInFailed')); }
}
function welcome() {  // the region is needed: this dialog has no close button
  const save = $('#wsave'), box = $('#regions');
  let pick = me.market;
  $('#wname').textContent = me.name.split(' ')[0];
  $('#walerts').hidden = !cfg.email_alerts;
  box.innerHTML = cfg.regions.map(r => `<button type="button" data-c="${r.code}">${esc(r.name)} <small>(${esc(r.currency)})${r.live ? '' : ' · ' + t('soon')}</small></button>`).join('');
  box.onclick = e => { const btn = e.target.closest('button'); if (!btn) return;
    pick = btn.dataset.c; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === btn)); save.disabled = false; };
  save.onclick = async () => {
    signedIn(await api('/api/me', {method: 'PATCH', body: JSON.stringify({market: pick, email_alerts: $('#wmail').checked})}));
    $('#welcome').hidden = true;
  };
  $('#welcome').hidden = false;
}
const agoSec = at => ago(at * 1000);
async function drawPanel() {
  const tabs = `<div class="tabs">${['notes', 'watches', 'settings']
    .map(k => `<button type="button" data-tab="${k}" class="${tab === k ? 'on' : ''}">${t(k)}</button>`).join('')}</div>`;
  panel.innerHTML = tabs + `<div class="panel-hint">${t('wait')}</div>`;
  let body = '';
  try {
    if (tab === 'notes') {
      const d = await api('/api/notifications');
      body = d.notifications.map(n => `<div class="row ${n.seen ? '' : 'new'}">${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener nofollow">${esc(n.title)}</a>` : esc(n.title)}` +
        `<div>${esc(n.body)}</div><div class="when">${agoSec(n.created_at)}</div></div>`).join('') || `<div class="panel-hint">${t('noNotes')}</div>`;
      if (d.unseen) { api('/api/notifications/seen', {method: 'POST'}); unseen = 0; drawAcct(); }
    } else if (tab === 'watches') {
      const d = await api('/api/watches');
      body = d.watches.map(w => `<div class="row"><button class="x" type="button" data-unwatch="${w.id}">${t('cancelWatch')}</button>` +
        `<a href="${esc(w.url)}" target="_blank" rel="noopener nofollow">${esc(w.title)}</a>` +
        `<div class="when">${esc(w.store)} · ${t('nowAt')} ${fmt(w.price)}${w.price < w.first_price ? ` (${t('was')} ${fmt(w.first_price)})` : ''}</div></div>`).join('') ||
        `<div class="panel-hint">${t('noWatches')}</div>`;
    } else {
      body = `<div class="set">
        <div dir="ltr" style="text-align:start">${esc(me.email)}</div>
        <label>${t('yourRegion')}: <select id="smarket">${cfg.regions.map(r => `<option value="${r.code}" ${r.code === me.market ? 'selected' : ''}>${esc(r.name)}${r.live ? '' : ' (' + t('soon') + ')'}</option>`).join('')}</select></label>
        ${cfg.email_alerts ? `<label><input type="checkbox" id="smail" ${me.email_alerts ? 'checked' : ''}> ${t('mailAlerts')}</label>` : ''}
        <label><input type="checkbox" id="sunsure" ${me.prefs.hide_unsure_shops ? 'checked' : ''}> ${t('onlyTrusted')}</label>
        <button class="plain" type="button" id="slogout">${t('logout')}</button>
        <button class="danger" type="button" id="sdelete">${t('deleteMe')}</button></div>`;
    }
  } catch (e) { body = `<div class="err">${t('error')}</div>`; }
  panel.innerHTML = tabs + body;
}
panel.addEventListener('change', async e => {
  const patch = e.target.id === 'smarket' ? {market: e.target.value} : e.target.id === 'smail' ? {email_alerts: e.target.checked}
    : e.target.id === 'sunsure' ? {prefs: {hide_unsure_shops: e.target.checked}} : null;
  if (patch) signedIn(await api('/api/me', {method: 'PATCH', body: JSON.stringify(patch)}));
});
acct.addEventListener('click', async e => {
  const b2 = e.target.closest('button'); if (!b2) return;
  if (b2.classList.contains('bell') || b2.classList.contains('me')) {
    tab = b2.classList.contains('bell') ? 'notes' : 'settings';
    panel.hidden = !panel.hidden; if (!panel.hidden) drawPanel();
  } else if (b2.dataset.tab) { tab = b2.dataset.tab; drawPanel(); }
  else if (b2.dataset.unwatch) { await api('/api/watches/' + b2.dataset.unwatch, {method: 'DELETE'}).catch(() => {}); drawPanel(); }
  else if (b2.id === 'slogout') { await api('/api/auth/logout', {method: 'POST'}); location.reload(); }
  else if (b2.id === 'sdelete' && confirm(t('sureDelete'))) { await api('/api/me', {method: 'DELETE'}); location.reload(); }
});
document.addEventListener('click', e => {  // a click outside closes the panel (a redrawn tab button is no longer on the page)
  if (!panel.hidden && e.target.isConnected && !acct.contains(e.target)) panel.hidden = true;
});
document.addEventListener('click', async e => {  // "follow price" on a result
  const btn = e.target.closest('.act.watch'); if (!btn) return;
  const w = btn.closest('.wrap'), p = shown[+w.dataset.t].results[+w.dataset.i], lbl = btn.querySelector('span');
  if (!me) {
    if (!cfg.google_client_id) return;
    lbl.textContent = t('signInToFollow'); window.google?.accounts.id.prompt(); return;
  }
  try {
    if (p.watched) {
      const d = await api('/api/watches'), found = d.watches.find(x => x.url === p.url);
      if (found) await api('/api/watches/' + found.id, {method: 'DELETE'});
      p.watched = false;
    } else {
      await api('/api/watches', {method: 'POST', body: JSON.stringify({url: p.url, title: p.title, store: p.store || '',
                                                                     image: p.image || '', price: p.price})});
      p.watched = true;
    }
    btn.classList.toggle('on', p.watched); lbl.textContent = p.watched ? t('following') : t('follow');
  } catch (err) { lbl.textContent = err.detail && typeof err.detail === 'string' ? err.detail : t('error'); }
});
(async function startAccounts() {
  try { cfg = await api('/api/config'); } catch (e) { return; }
  if (cfg.markets) { markets = cfg.markets; marketCode = cfg.market; drawRegion(); }
  if (!cfg.google_client_id) return;  // sign-in is off on this server
  signedIn(await api('/api/me').catch(() => ({user: null})));
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({client_id: cfg.google_client_id, callback: onGoogle, ux_mode: 'popup', auto_select: false});
    const small = matchMedia('(max-width:760px)').matches;  // on phones the header has room for Google's round icon only
    google.accounts.id.renderButton(gbtn, small ? {type: 'icon', shape: 'circle', size: 'large'}
                                                : {type: 'standard', shape: 'pill', size: 'large', text: 'signin_with', locale: lang});
  };
  document.head.appendChild(s);
  setInterval(() => { if (me && !document.hidden) api('/api/me').then(d => { if (d.user) { unseen = d.unseen; drawAcct(); } }).catch(() => {}); }, 120000);
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeState);
$('#year').textContent = new Date().getFullYear();
applyLang(); themeState();
</script>
</body>
