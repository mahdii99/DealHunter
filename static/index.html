<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealHunter - أرخص سعر في المتاجر</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#0f766e; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --text:#e8eaef; --muted:#9aa1ad; --accent:#2dd4bf; --border:#2a2f3a; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:900px; margin:0 auto; padding:24px 16px 120px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .top button { padding:8px 14px; font-size:14px; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #chat { display:grid; gap:18px; }
  .u { justify-self:start; max-width:80%; background:var(--accent); color:#fff; padding:10px 14px; border-radius:16px 16px 16px 4px; white-space:pre-wrap; }
  .a { display:grid; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:6px 12px; font-size:14px; border-radius:20px; background:var(--card); color:var(--accent); border:1px solid var(--accent); }
  .sugg { font-size:13px; color:var(--muted); }
  .req { font-size:13px; color:var(--muted); }
  .composer { position:fixed; bottom:0; inset-inline:0; background:var(--bg); border-top:1px solid var(--border); padding:12px 16px; }
  .composer form { max-width:900px; margin:0 auto; }
  .hint { color:var(--muted); font-size:14px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:14px; font-size:16px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); }
  button { padding:0 22px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  .meta { color:var(--muted); font-size:14px; margin:14px 0; min-height:20px; }
  .meta.live .step::before { content:""; display:inline-block; width:8px; height:8px; margin-inline-end:8px;
    border-radius:50%; background:var(--accent, #2dd4bf); animation:pulse 1s ease-in-out infinite; }
  .meta.live .secs { opacity:.6; font-size:12px; }
  @keyframes pulse { 50% { opacity:.25; } }
  .grid { display:grid; gap:12px; }
  .item { display:flex; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; text-decoration:none; color:inherit; }
  .item img { width:84px; height:84px; object-fit:contain; background:#fff; border-radius:8px; flex-shrink:0; }
  .item .t { font-size:15px; line-height:1.4; direction:ltr; text-align:left; }
  .item .p { font-weight:700; font-size:18px; margin-top:6px; color:var(--accent); }
  .item .old { text-decoration:line-through; color:var(--muted); font-size:13px; margin-inline-start:8px; font-weight:400; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--muted); margin-top:6px; }
  .badge[title] { cursor:help; }
  .badge.ok { color:var(--accent); border-color:var(--accent); }
  .badge.deal { color:#fff; background:#dc2626; border-color:#dc2626; }
  .badge.warn { color:#ea580c; border-color:#ea580c; }
  .best { border-color:var(--accent); }
  .und { color:var(--text); margin-bottom:4px; }
  .sum { margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--card); border:1px solid var(--accent); color:var(--text); }
  .coupon { font-size:13px; color:#ea580c; margin-top:2px; }
  .note { font-size:13px; color:var(--muted); margin-top:4px; }
  .err { color:#b45309; font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>DealHunter</h1><button id="reset" type="button" hidden>طلب جديد</button></div>
  <p class="sub">قولّي محتاج إيه بكلامك حتى لو مش عارف اسمه، وأنا أدورلك في المتاجر على أرخص سعر. وبعد النتايج تقدر تكمّل وتعدّل على طلبك.</p>
  <div id="chat"></div>
</main>
<div class="composer">
  <form id="f">
    <input id="q" placeholder="اكتب طلبك أو عدّل على اللي فات..." autocomplete="off" required minlength="2" maxlength="300">
    <button id="b">ابعت</button>
  </form>
</div>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');
const chat = document.getElementById('chat'), reset = document.getElementById('reset');
let history = [], currentRequest = '';  // the chat so far + the standalone request of the last search
function trustBadge(p) {
  const tip = esc((p.trust_signals || []).join('، '));
  if (p.trusted) return '<span class="badge ok" title="متجر كبير ومعروف في مصر">متجر مشهور</span>';
  const sc = p.trust_score ?? 0;
  if (sc >= 60) return `<span class="badge ok" title="${tip}">متجر موثوق ${sc}%</span>`;
  if (sc >= 40) return `<span class="badge" title="${tip}">ثقة متوسطة ${sc}%</span>`;
  return `<span class="badge warn" title="${tip}">متجر غير مؤكد</span>`;
}
function imgFail(img) {  // store blocks hotlinking? load it through our server, else hide it
  if (img.dataset.proxy) { img.src = img.dataset.proxy; delete img.dataset.proxy; } else img.remove();
}
const fmt = n => new Intl.NumberFormat('ar-EG').format(n) + ' ج.م';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(p, i) {
  return `
      <a class="item ${i === 0 ? 'best' : ''}" href="${esc(p.url)}" target="_blank" rel="noopener nofollow">
        ${p.image ? `<img src="${esc(p.image)}" data-proxy="/img?u=${encodeURIComponent(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">` : ''}
        <div>
          <div class="t">${esc(p.title)}</div>
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
          <div class="p">${fmt(p.price)}${p.old_price && p.old_price > p.price ? `<span class="old">${fmt(p.old_price)}</span>` : ''}</div>
          ${p.coupon_price ? `<div class="coupon">${fmt(p.coupon_price)} بعد كوبون ${fmt(p.price - p.coupon_price)} عند الدفع</div>` : ''}
          <span class="badge">${esc(p.store)}</span> ${p.condition ? `<span class="badge warn">${({used:'مستعمل',refurbished:'مجدد','open box':'أوبن بوكس'})[p.condition] || esc(p.condition)}</span> ` : ''}${trustBadge(p)}${p.discount_pct ? ` <span class="badge deal">خصم ${p.discount_pct}%</span>` : ''}${p.best_deal ? ' <span class="badge deal">أحسن عرض</span>' : ''}${p.unconfirmed ? ' <span class="badge warn" title="العنوان مش موضح النوع بالظبط، اتأكد من صفحة المنتج">اتأكد من الموديل</span>' : ''} ${i === 0 ? '<span class="badge">الأرخص</span>' : ''}
        </div>
      </a>`;
}
function add(cls, html) {
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html; chat.appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'start'}); return el;
}
function render(d) {  // one assistant turn
  if (d.action === 'answer') return `<div class="sum">${esc(d.answer)}</div>`;
  if (d.action === 'ask') {
    return `<div class="und">${esc(d.question)}</div>` +
      `<div class="chips">${(d.options || []).map(o => `<button class="chip" type="button">${esc(o)}</button>`).join('')}</div>`;
  }
  const errs = Object.keys(d.store_errors || {});
  const alt = d.results.length && d.results[0].alternative;
  return (d.demo ? '<div class="err">وضع تجريبي: نتايج من صفحات عينة مش أسعار حقيقية</div>' : '') +
    (d.understood ? `<div class="und">${esc(d.understood)}</div>` : '') +
    (d.suggested_products && d.suggested_products.length ? `<div class="sugg">حاجات تناسب طلبك دوّرت عليها: ${d.suggested_products.map(esc).join('، ')}</div>` : '') +
    `<div class="meta">راجعنا ${d.candidates_checked} منتج ولقينا ${d.count} مناسب` + (d.max_price ? ` · تحت ${fmt(d.max_price)}` : '') + '</div>' +
    (d.summary ? `<div class="sum">${esc(d.summary)}</div>` : '') +
    (errs.length ? `<div class="err">صفحات مقدرناش نفتحها: ${errs.map(k => esc(k) + ' (' + esc(d.store_errors[k]).slice(0, 60) + ')').join('، ')}</div>` : '') +
    (alt ? '<div class="err">مالقيناش المطلوب بالظبط، ودي أقرب بدائل من متاجر حقيقية:</div>' : '') +
    `<div class="grid">${d.results.map(card).join('')}</div>` +
    (d.results.length ? '<div class="hint">عايز تغيّر حاجة؟ اكتبها تحت، مثلاً: ماركة معينة، أرخص، لون تاني.</div>' : '');
}
function remember(d) {  // what the assistant "said", so the next message is understood in context
  if (d.action === 'ask') return d.question;
  if (d.action === 'answer') return d.answer;
  const top = d.results.slice(0, 5).map((p, i) => `${i + 1}) ${p.title} - ${p.price} EGP (${p.store})`).join('; ');
  return [d.understood, d.summary, top && 'Shown: ' + top].filter(Boolean).join(' ');
}
async function send(text) {
  text = text.trim(); if (text.length < 2 || b.disabled) return;
  reset.hidden = false; q.value = '';
  add('u', esc(text));
  history.push({role: 'user', text});
  const a = add('a', '<div class="meta live"><span class="step">بفهم طلبك...</span> <span class="secs"></span></div>');
  const step = a.querySelector('.step'), secs = a.querySelector('.secs'), t0 = Date.now();
  const timer = setInterval(() => { secs.textContent = Math.round((Date.now() - t0) / 1000) + ' ث'; }, 1000);
  b.disabled = true;
  try {
    // progress arrives line by line (what the agent is doing now), the answer comes in the last line
    const r = await fetch('/api/chat/stream', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                              body: JSON.stringify({messages: history.slice(-12), request: currentRequest})});
    if (!r.ok || !r.body) throw new Error(r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', d = null;
    while (!d) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'status') step.textContent = ev.text;
        else if (ev.type === 'done') d = ev.data;
        else if (ev.type === 'error') throw new Error(ev.status);
      }
    }
    if (!d) throw new Error('no answer');
    if (d.action === 'search') currentRequest = d.request || currentRequest;
    history.push({role: 'assistant', text: remember(d).slice(0, 1500)});
    a.innerHTML = render(d);
  } catch (err) {
    history.pop();
    a.innerHTML = '<div class="err">حصلت مشكلة، جرب تاني.</div>';
  } finally { clearInterval(timer); b.disabled = false; q.focus(); }
}
f.addEventListener('submit', e => { e.preventDefault(); send(q.value); });
document.addEventListener('click', e => {  // quick answers of a question
  if (e.target.classList.contains('chip')) send(e.target.textContent);
});
reset.addEventListener('click', () => {
  history = []; currentRequest = ''; chat.innerHTML = ''; reset.hidden = true; q.focus();
});
</script>
</body>
</html>
